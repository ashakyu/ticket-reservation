server:
  port: 8082

spring:
  application:
    name: concert-service
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_concert?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.ticket: DEBUG